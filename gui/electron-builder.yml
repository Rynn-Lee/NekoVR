appId: dev.nekovr.NekoVR
productName: NekoVR
# Global naming pattern
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

directories:
  output: dist/artifacts/${os}

asar: true
asarUnpack:
  - out/main/chunks/*.jar

electronLanguages:
  - en-US
  - ru-RU

files:
  - out/**/*
  - index.html
  - package.json
  - node_modules/**
  - "!node_modules/*/{README,readme,README.md,readme.md,CHANGELOG,CHANGELOG.md,changelog.md}"
  - "!node_modules/*/{test,tests,__tests__,docs,doc,example,examples}"
  - "!node_modules/*/.{git,github,vscode,editorconfig,eslintrc,prettierrc}"
  - "!node_modules/**/*.{map,ts,tsx,d.ts}"
  - "!**/.DS_Store"

win:
  artifactName: "NekoVR-Setup-${version}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
  icon: "./electron/resources/icons/icon.ico"
  extraFiles:
    - from: "../server/desktop/build/libs/slimevr.jar"
      to: "."
    - from: "C:/MyApps/SlimeVR Server/jre"
      to: "./jre"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "NekoVR"
  uninstallDisplayName: "NekoVR"
  installerIcon: "./electron/resources/icons/icon.ico"
  uninstallerIcon: "./electron/resources/icons/icon.ico"

linux:
  category: Game
  artifactName: "${productName}-${arch}.${ext}"
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  extraFiles:
    - from: "../server/desktop/build/libs/slimevr.jar"
      to: "."
  icon: "./electron/resources/icons"
